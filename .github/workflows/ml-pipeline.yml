name: ML pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest tests -v

      - name: Lancer le pipeline
        shell: bash  # active pipefail : un échec du pipeline n'est pas masqué par tee
        run: python run_pipeline.py | tee run.log

      - name: Résumé des résultats
        if: always()
        shell: bash
        run: |
          if [ -f run.log ]; then
            { echo '```'; cat run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sauvegarder les runs MLflow
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlflow-${{ github.run_number }}
          path: |
            mlflow.db
            mlruns/
            run.log
          if-no-files-found: warn
          retention-days: 14
